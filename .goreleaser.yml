version: 2

project_name: exhumed

before:
  hooks:
    - go mod tidy

builds:
  - id: exhumed
    main: ./cmd/exhumed
    binary: exhumed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/bugsyhewitt/exhumed/internal/version.Version={{.Version}}
      - -X github.com/bugsyhewitt/exhumed/internal/version.Commit={{.ShortCommit}}
      - -X github.com/bugsyhewitt/exhumed/internal/version.Date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
