schema_version: 1
group:
  id: credential-stores
  name: Credential Store and Package-Manager Token Files
  description: >-
    Dedicated credential stores and the auth files package managers, container
    tooling, and secret backends leave on disk — kubeconfig, Docker registry
    auth, Vault tokens, npmrc/pypirc/pip, and SSH client config. These hold the
    long-lived tokens that authenticate automation to registries and clusters.
  os: [linux]
  category: credential-store
entries:
  - id: kubeconfig
    name: Kubernetes kubeconfig
    description: kubectl client config. Contains cluster API endpoints plus client certs, bearer tokens, or exec auth — frequently cluster-admin. The headline cluster-takeover file.
    path: /root/.kube/config
    alt_paths:
      - /home/ubuntu/.kube/config
      - /var/www/.kube/config
      - /etc/kubernetes/admin.conf
    os: [linux]
    info_goal: credentials
    privilege: elevated
    confirm:
      type: keyword-all
      patterns:
        - 'apiVersion'
        - 'clusters'
        - 'users'
    parser: generic-secrets
    references:
      - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
    tags: [r2-curated, modern, credential-store, container]

  - id: docker-config-json
    name: Docker config.json registry auth
    description: Docker client config. The auths map holds base64 registry credentials and identitytokens — reusable to pull or push private images.
    path: /root/.docker/config.json
    alt_paths:
      - /home/ubuntu/.docker/config.json
      - /var/www/.docker/config.json
    os: [linux]
    info_goal: credentials
    privilege: app-user
    confirm:
      type: keyword-all
      patterns:
        - '"auths"'
      negate:
        - 'No such file or directory'
    parser: generic-secrets
    references:
      - https://docs.docker.com/engine/reference/commandline/cli/#configuration-files
    tags: [r2-curated, modern, credential-store, container]

  - id: vault-token
    name: HashiCorp Vault token helper
    description: Vault CLI token cache written by the default token helper. A single line containing a live Vault token that inherits the caller's policies.
    path: /root/.vault-token
    alt_paths:
      - /home/ubuntu/.vault-token
      - /var/www/.vault-token
    os: [linux]
    info_goal: tokens
    privilege: app-user
    confirm:
      type: regex
      patterns:
        - '^(hvs\.|hvb\.|s\.)[A-Za-z0-9._-]+'
    parser: none
    references:
      - https://developer.hashicorp.com/vault/docs/commands/token-helper
    tags: [r2-curated, modern, credential-store]

  - id: npmrc
    name: npm .npmrc auth token
    description: npm config file. The _authToken / _auth lines authenticate to npm or a private registry — reusable to publish or pull scoped packages.
    path: /root/.npmrc
    alt_paths:
      - /home/node/.npmrc
      - /var/www/.npmrc
      - /usr/src/app/.npmrc
    os: [linux]
    info_goal: tokens
    privilege: app-user
    confirm:
      type: regex
      patterns:
        - '(_authToken|_auth|_password)\s*='
    parser: env
    references:
      - https://docs.npmjs.com/cli/configuring-npm/npmrc
    tags: [r2-curated, modern, credential-store]

  - id: pypirc
    name: Python .pypirc upload credentials
    description: Python packaging config used by twine/setuptools. Stores PyPI repository usernames, passwords, and upload tokens in plaintext INI form.
    path: /root/.pypirc
    alt_paths:
      - /home/ubuntu/.pypirc
      - /var/www/.pypirc
    os: [linux]
    info_goal: credentials
    privilege: app-user
    confirm:
      type: keyword-all
      patterns:
        - '[pypi]'
        - 'username'
    parser: ini-config
    references:
      - https://packaging.python.org/specifications/pypirc/
    tags: [r2-curated, credential-store]

  - id: pip-conf
    name: pip pip.conf index credentials
    description: pip configuration. The index-url may carry inline credentials for a private package index, and extra-index-url reveals additional registries.
    path: /root/.config/pip/pip.conf
    alt_paths:
      - /etc/pip.conf
      - /var/www/.pip/pip.conf
    os: [linux]
    info_goal: credentials
    privilege: app-user
    confirm:
      type: regex
      patterns:
        - '(?i)(index-url|extra-index-url)\s*='
    parser: ini-config
    references:
      - https://pip.pypa.io/en/stable/topics/configuration/
    tags: [r2-curated, credential-store]

  - id: composer-auth
    name: Composer auth.json
    description: PHP Composer authentication file. Contains http-basic credentials and github/gitlab OAuth tokens used to fetch private packages.
    path: /var/www/html/auth.json
    alt_paths:
      - /root/.composer/auth.json
      - /root/.config/composer/auth.json
    os: [linux]
    info_goal: tokens
    privilege: app-user
    confirm:
      type: regex
      patterns:
        - '(?i)(http-basic|github-oauth|gitlab-token)'
    parser: generic-secrets
    references:
      - https://getcomposer.org/doc/articles/authentication-for-private-packages.md
    tags: [r2-curated, modern, credential-store]

  - id: maven-settings
    name: Maven settings.xml
    description: Apache Maven settings. The servers section stores repository usernames and passwords (often deploy credentials) in plaintext XML.
    path: /root/.m2/settings.xml
    alt_paths:
      - /home/ubuntu/.m2/settings.xml
      - /var/www/.m2/settings.xml
    os: [linux]
    info_goal: credentials
    privilege: app-user
    confirm:
      type: keyword-all
      patterns:
        - '<settings'
        - '<servers>'
    parser: none
    references:
      - https://maven.apache.org/settings.html
    tags: [r2-curated, credential-store]

  - id: ssh-config
    name: SSH client config
    description: OpenSSH client config. Maps host aliases to real hostnames, users, ports, identity files, and jump hosts — a network and key inventory for lateral movement.
    path: /root/.ssh/config
    alt_paths:
      - /home/ubuntu/.ssh/config
      - /var/www/.ssh/config
    os: [linux]
    info_goal: network-info
    privilege: app-user
    confirm:
      type: regex
      patterns:
        - '(?im)^\s*(Host|HostName|IdentityFile)\s'
    parser: none
    references:
      - https://man.openbsd.org/ssh_config
    tags: [r2-curated, credential-store]

  - id: ssh-known-hosts
    name: SSH known_hosts
    description: OpenSSH known_hosts. Even when hashed, plain entries enumerate the hosts this account has connected to — a target list for pivoting.
    path: /root/.ssh/known_hosts
    alt_paths:
      - /home/ubuntu/.ssh/known_hosts
    os: [linux]
    info_goal: network-info
    privilege: app-user
    confirm:
      type: regex
      patterns:
        - '(ssh-rsa|ssh-ed25519|ecdsa-sha2|\|1\|)'
    parser: none
    references:
      - https://man.openbsd.org/sshd#SSH_KNOWN_HOSTS_FILE_FORMAT
    tags: [r2-curated, credential-store]

  - id: rclone-conf
    name: rclone rclone.conf
    description: rclone remote config. Stores access keys, tokens, and (obscured but reversible) passwords for every configured cloud storage backend.
    path: /root/.config/rclone/rclone.conf
    alt_paths:
      - /home/ubuntu/.config/rclone/rclone.conf
    os: [linux]
    info_goal: credentials
    privilege: app-user
    confirm:
      type: regex
      patterns:
        - '(?i)(access_key_id|secret_access_key|token|password)\s*='
    parser: env
    references:
      - https://rclone.org/docs/
    tags: [r2-curated, modern, credential-store]
