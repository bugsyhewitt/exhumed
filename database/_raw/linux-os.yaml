schema_version: 1
group:
  id: raw-linux-os
  name: Raw Linux OS Files
  description: 'Unfiltered harvest of Linux system and config file paths from SecLists gracefulsecurity list.'
  os: [linux, bsd, macos]
  category: os
entries:
  - id: etc-passwd
    name: '/etc/passwd'
    description: 'User account or credential file.'
    path: '/etc/passwd'
    os: [linux, bsd, macos]
    info_goal: credentials
    privilege: app-user
    confirm:
      type: keyword
      patterns:
        - 'root:'
    parser: unix-passwd
    references:
      - https://github.com/danielmiessler/SecLists/blob/master/Fuzzing/LFI/Linux/LFI-gracefulsecurity-linux.txt
    tags: [raw, needs-confirm-review]

  - id: etc-shadow
