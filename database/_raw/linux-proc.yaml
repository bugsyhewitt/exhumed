schema_version: 1
group:
  id: raw-linux-lfisuite
  name: Raw LFISuite Linux Paths
  description: 'Unfiltered harvest from LFISuite path-to-test list including /proc entries.'
  os: [linux]
  category: os
entries:
  - id: etc-passwd
    name: '/etc/passwd'
    description: 'User account or credential file.'
    path: '/etc/passwd'
    os: [linux]
    info_goal: credentials
    privilege: app-user
    confirm:
      type: keyword
      patterns:
        - 'root:'
    parser: unix-passwd
    references:
      - https://github.com/danielmiessler/SecLists/blob/master/Fuzzing/LFI/LFI-LFISuite-pathtotest.txt
    tags: [raw, needs-confirm-review]

  - id: etc-shadow
    name: '/etc/shadow'
    description: 'Hashed passwords or shadow file.'
    path: '/etc/shadow'
    os: [linux]
    info_goal: credentials
    privilege: elevated
    confirm:
      type: keyword
      patterns:
        - 'root:'
    parser: unix-shadow
    references:
      - https://github.com/danielmiessler/SecLists/blob/master/Fuzzing/LFI/LFI-LFISuite-pathtotest.txt
    tags: [raw, needs-confirm-review]

  - id: etc-group
    name: '/etc/group'
    description: 'System file.'
    path: '/etc/group'
    os: [linux]
    info_goal: system-info
    privilege: app-user
    confirm:
      type: keyword
      patterns:
        - 'group'
    references:
      - https://github.com/danielmiessler/SecLists/blob/master/Fuzzing/LFI/LFI-LFISuite-pathtotest.txt
    tags: [raw, needs-confirm-review]

  - id: proc-self-environ
    name: '/proc/self/environ'
    description: 'Environment variables; may contain secrets.'
    path: '/proc/self/environ'
    os: [linux]
    info_goal: environment
    privilege: app-user
    confirm:
      type: keyword
      patterns:
        - 'PATH='
    references:
      - https://github.com/danielmiessler/SecLists/blob/master/Fuzzing/LFI/LFI-LFISuite-pathtotest.txt
    tags: [raw, needs-confirm-review]

  - id: proc-self-cmdline
    name: '/proc/self/cmdline'
    description: '/proc cmdline of web process.'
    path: '/proc/self/cmdline'
    os: [linux]
    info_goal: system-info
    privilege: app-user
    confirm:
      type: keyword
      patterns:
        - '/bin'
    references:
      - https://github.com/danielmiessler/SecLists/blob/master/Fuzzing/LFI/LFI-LFISuite-pathtotest.txt
    tags: [raw, needs-confirm-review]

  - id: proc-self-stat
